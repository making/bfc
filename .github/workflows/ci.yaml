name: Java CI with Maven

on:
  push:
    branches:
    - develop
    - main
    paths:
    - src/**
    - pom.xml
    - .github/workflows/ci.yaml
  pull_request_target:
    branches:
    - develop
    - main
    paths:
    - src/**
    - pom.xml
    - .github/workflows/ci.yaml
jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          platform: x86_64-pc-linux
          move: mv
          separator: /
          extension: ""
        - os: ubuntu-24.04-arm
          platform: aarch64-pc-linux
          move: mv
          separator: /
          extension: ""
        - os: macos-13
          platform: x86_64-apple-darwin
          move: mv
          separator: /
          extension: ""
        - os: macos-latest
          platform: aarch64-apple-darwin
          move: mv
          separator: /
          extension: ""
        - os: windows-latest
          platform: x86_64-pc-win32
          move: move
          separator: \
          extension: .exe
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v3
    - uses: graalvm/setup-graalvm@v1
      with:
        java-version: '17'
        distribution: 'graalvm'
        native-image-job-reports: 'true'
    - name: Build bfc
      run: |
        mkdir dist
        ./mvnw -V --no-transfer-progress package -Pnative
        ${{ matrix.move }} target${{ matrix.separator }}bfc${{ matrix.extension }} dist${{ matrix.separator }}bfc-${{ matrix.platform }}${{ matrix.extension }}
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: bfc${{ matrix.extension }}
        path: dist${{ matrix.separator }}bfc-${{ matrix.platform }}${{ matrix.extension }}
